name: Windows protocol engines
on:
  pull_request:
    paths: ['desktop/src-tauri/src/naive.rs', 'desktop/src-tauri/src/vpn.rs', 'desktop/src-tauri/src/main.rs', 'desktop/tests/engine-lifecycle-regression/**', 'desktop/tests/session-startup-regression/**', 'desktop/helper/**', 'ops/deploy/**', '.github/windows_protocol_smoke.py', '.github/workflows/protocol-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Process exit recovery regressions
        run: |
          python desktop/tests/engine-lifecycle-regression/run.py
          python desktop/tests/session-startup-regression/run.py
      - name: Compile actual native configuration generator
        shell: bash
        run: |
          cargo test --locked --manifest-path desktop/tests/naive-regression/Cargo.toml
          cargo build --locked --manifest-path desktop/tests/naive-regression/Cargo.toml --bin emit-protocol-profile
      - name: Reject corrupted packages and incorrect architecture
        run: python ops/deploy/test_windows_bundle.py
      - name: Verify official archives and Windows bundle
        shell: bash
        run: python ops/deploy/protocol_desktop_stage.py --desktop desktop --target x86_64-pc-windows-msvc --cache "$RUNNER_TEMP/protocol-archives" --output "$RUNNER_TEMP/protocol-overlay"
      - name: Real engine startup, HTTPS and stop
        shell: bash
        run: python .github/windows_protocol_smoke.py --archives "$RUNNER_TEMP/protocol-archives" --emit "$GITHUB_WORKSPACE/desktop/tests/naive-regression/target/debug/emit-protocol-profile.exe" --output "$RUNNER_TEMP/windows-protocol-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-protocol-result
          path: ${{ runner.temp }}/windows-protocol-result.json
          if-no-files-found: error
