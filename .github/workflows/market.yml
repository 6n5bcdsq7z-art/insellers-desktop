name: INSELLERS marketplace apps
on:
  push:
    branches: [main]
    paths: ['market/**', '.github/workflows/market.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: '--win --x64'
          - os: macos-latest
            target: '--mac --arm64 --x64'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: market/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market/apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build number
        run: node -e "const fs=require('fs');const p=require('./package.json');p.version='1.0.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Build installers
        run: npm run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: market-${{ matrix.os }}
          path: |
            market/apps/desktop/dist/*.exe
            market/apps/desktop/dist/*.dmg
          if-no-files-found: error
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market/apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MARKET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/market.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/market.jks" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 assembleDebug assembleRelease lint 2>&1 | tee android-build.log
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MARKET_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MARKET_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MARKET_ANDROID_KEY_PASSWORD }}
      - name: Collect installable APK
        shell: bash
        run: |
          mkdir out
          if [ '${{ steps.signing.outputs.signed }}' = true ]; then
            cp app/build/outputs/apk/release/app-release.apk out/INSELLERS-android.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/INSELLERS-android-test.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: market-android
          path: market/apps/android/out/*.apk
          if-no-files-found: error
      - name: Save build diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f android-build.log ] || echo 'Build step did not run; inspect preceding Actions steps.' > android-build.log
          tail -c 60000 android-build.log > android-build-tail.log
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/market-ci-logs" >/dev/null 2>&1 || \
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/market-ci-logs -f sha="$GITHUB_SHA" >/dev/null
          FILE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/logs/market-android.log?ref=market-ci-logs" --jq .sha 2>/dev/null || true)
          PAYLOAD=$(base64 -w0 android-build-tail.log)
          args=(-f message="Android build diagnostics $GITHUB_RUN_NUMBER" -f branch=market-ci-logs -f content="$PAYLOAD")
          if [ -n "$FILE_SHA" ]; then args+=(-f sha="$FILE_SHA"); fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/logs/market-android.log" "${args[@]}" >/dev/null
  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish all platforms together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd installers
          sha256sum *.exe *.dmg *.apk > SHA256SUMS.txt
          cat > release-notes.txt <<'NOTES'
          INSELLERS — поставщики, товары и заявки. Android, Windows и macOS (Apple Silicon / Intel).

          Интерфейс и данные общие с Telegram mini-app; изменения сервера приходят без переустановки.
          Вход: начните вход в приложении, откройте ссылку Telegram, сверьте код, подтвердите и вернитесь.

          Первый выпуск для проверки: Windows/macOS пока без подписи разработчика и нотарификации Apple.
          Файл android-test.apk — тестовая сборка. Для стабильных Android-обновлений требуется постоянный ключ подписи; тестовая сборка не предназначена для массового распространения.
          NOTES
          gh release create "market-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" *.exe *.dmg *.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "INSELLERS — приложения (${GITHUB_SHA:0:7})" --notes-file release-notes.txt
