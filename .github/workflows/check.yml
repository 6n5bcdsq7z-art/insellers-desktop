name: check
# Только проверка компиляции (cargo check) для веток check-*: ничего не собирает и не публикует.
on:
  push:
    branches: ["check-*"]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop/src-tauri, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: заглушки sidecar и иконки
        run: |
          mkdir -p binaries
          T=$(rustc -vV | sed -n 's/^host: //p')
          X=""; [ "$RUNNER_OS" = "Windows" ] && X=".exe"
          for b in xray wireproxy ins-helper sing-box; do touch binaries/$b-$T$X; chmod +x binaries/$b-*; done
          mkdir -p icons && for f in 32x32.png 128x128.png 128x128@2x.png icon.png; do cp app-icon.png icons/$f; done
          cp app-icon.png icons/icon.icns
          # настоящий .ico (PNG внутри ICO) - компилятор ресурсов Windows не принимает png с расширением .ico
          python -c "import struct;d=open('app-icon.png','rb').read();open('icons/icon.ico','wb').write(struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',0,0,0,0,1,32,len(d),22)+d)" || python3 -c "import struct;d=open('app-icon.png','rb').read();open('icons/icon.ico','wb').write(struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',0,0,0,0,1,32,len(d),22)+d)"
      - run: cargo check 2>&1 | tail -80
      - run: cargo check
