name: tun-test
# Проверка механизма TUN (ins-helper + sing-box + ядро xray) на настоящих macOS и Windows. Запуск вручную.
# Конфигурация тестового ключа - секрет TUN_TEST_CONFIG (временный ключ, удаляется после проверки).
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  tun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated test configuration without displaying it
        env:
          CFG: ${{ secrets.TUN_TEST_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os
          value = os.environ.get("CFG", "").strip()
          if not value:
              print("::error title=TUN acceptance blocked::TUN_TEST_CONFIG is not configured; no live tunnel acceptance is possible.")
              raise SystemExit(1)
          try:
              cfg = json.loads(value)
              assert isinstance(cfg.get("inbounds"), list) and isinstance(cfg.get("outbounds"), list)
              assert any(o.get("protocol") not in ("freedom", "blackhole", "dns") for o in cfg["outbounds"])
          except Exception:
              print("::error title=TUN acceptance blocked::Test configuration is invalid; contents were not logged.")
              raise SystemExit(1)
          if any(os.environ.get(k) for k in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "http_proxy", "https_proxy", "all_proxy")):
              print("::error title=TUN acceptance blocked::Runner has a managed proxy; direct system-routing test cannot bypass it.")
              raise SystemExit(1)
          # Isolated probe input: prove the server/engine before testing the
          # unchanged normal profile routing on SOCKS38808. No account changes.
          remote = next(o for o in cfg["outbounds"] if o.get("protocol") not in ("freedom", "blackhole", "dns"))
          if not remote.get("tag"):
              remote["tag"] = "audit-vpn"
          assert all(i.get("port") != 38812 and i.get("tag") != "audit-probe" for i in cfg["inbounds"])
          cfg["inbounds"].append({"listen":"127.0.0.1","port":38812,"protocol":"http","tag":"audit-probe"})
          cfg.setdefault("routing", {}).setdefault("rules", []).insert(0,
              {"type":"field","inboundTag":["audit-probe"],"outboundTag":remote["tag"]})
          protocol = remote.get("protocol")
          safe = protocol if protocol in ("vless","vmess","trojan","shadowsocks","hysteria","hysteria2","socks","http","wireguard") else "other"
          print("::notice title=TUN test scope::Isolated first remote outbound protocol: " + safe)
          settings = remote.get("streamSettings", {})
          transport, security = settings.get("network","tcp"), settings.get("security","none")
          transport = transport if transport in ("tcp","raw","ws","xhttp","splithttp","grpc","httpupgrade","h2","quic") else "other"
          security = security if security in ("none","tls","reality") else "other"
          print("::notice title=TUN test scope::Transport: " + transport + "; security: " + security)
          # Private ephemeral diagnostics; publish error categories only.
          cfg["log"] = {"loglevel":"debug","access":"xray-access.log","error":"xray-error.log"}
          fd = os.open("client.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd,"w") as output:
              json.dump(cfg,output)
          print("Isolated test configuration present; contents not logged.")
          PY
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - name: Ядро, sing-box, помощник, гео
        run: |
          set -e
          umask 077
          SB=$(cat desktop/helper/sing-box.version); X=https://github.com/XTLS/Xray-core/releases/download/v26.3.27
          G=https://github.com/SagerNet/sing-box/releases/download/v$SB
          (cd desktop/helper && CGO_ENABLED=0 go build -o ../../ins-helper$([ "$RUNNER_OS" = Windows ] && echo .exe) .)
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o x.zip $X/Xray-windows-64.zip && unzip -o -q x.zip xray.exe
            curl -fsSL -o s.zip $G/sing-box-$SB-windows-amd64.zip && unzip -o -q s.zip && cp sing-box-$SB-windows-amd64/sing-box.exe .
          else
            curl -fsSL -o x.zip $X/Xray-macos-arm64-v8a.zip && unzip -o -q x.zip xray
            curl -fsSL -o s.tgz $G/sing-box-$SB-darwin-arm64.tar.gz && tar xzf s.tgz && cp sing-box-$SB-darwin-arm64/sing-box .
          fi
          curl -fsSL -o geoip.dat https://vpn.insellers.su/app/geo/geoip.dat
          curl -fsSL -o geosite.dat https://vpn.insellers.su/app/geo/geosite.dat
          ls -la
      - name: Помощник (как после установки) и ядро
        run: |
          set -e
          umask 077
          if [ "$RUNNER_OS" = "Windows" ]; then
            D="/c/Program Files/INSELLERS VPN Helper"; mkdir -p "$D"; cp ins-helper.exe sing-box.exe "$D/"
            echo testtoken0123456789 > "$D/token"
            powershell -Command "Start-Process -FilePath 'C:\Program Files\INSELLERS VPN Helper\ins-helper.exe' -WindowStyle Hidden"
          else
            D=/Library/PrivilegedHelperTools/su.insellers.helper
            sudo mkdir -p $D && sudo chmod 755 $D && sudo cp ins-helper sing-box $D/ && echo testtoken0123456789 | sudo tee $D/token >/dev/null && sudo chown "$(id -un)" $D/token && sudo chmod 600 $D/token
            sudo nohup $D/ins-helper >/dev/null 2>&1 &
          fi
          XRAY_LOCATION_ASSET=$PWD nohup ./xray run -c client.json > xray.out 2>&1 &
          sleep 5
      - name: Проверки
        env:
          PYTHONIOENCODING: utf-8
        run: $( [ "$RUNNER_OS" = Windows ] && echo python || echo python3 ) .github/tun_test.py
      - name: Retain private logs on the ephemeral runner
        if: always()
        run: |
          echo "Only sanitized acceptance results are published. Profiles and raw core logs are not printed or uploaded."
