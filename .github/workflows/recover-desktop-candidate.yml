name: Recover a desktop candidate
on:
  push:
    tags:
      - "desktop-recover-*"
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Original main desktop build run'
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: desktop-publish
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Resolve original build run
        env:
          DISPATCH_RUN: ${{ inputs.run_id }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run_id="$DISPATCH_RUN"
          if [ -z "$run_id" ]; then
            run_id="${TAG_NAME#desktop-recover-}"
            run_id="${run_id%-r*}"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "Invalid build run: $run_id" >&2; exit 1 ;;
          esac
          echo "BUILD_RUN=$run_id" >> "$GITHUB_ENV"
      - name: Validate original build and reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/recover_candidate.py validate
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          pattern: bundle-*
          path: artifacts
      - name: Verify signatures and restore missing files
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_UPLOAD_KEY: ${{ secrets.DESKTOP_UPLOAD_KEY }}
        run: /usr/bin/python3 .github/recover_candidate.py restore
