[package]
name = "insellers-vpn"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
sysproxy = "0.3"
sysinfo = "=0.32.1"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
# обновление своей загрузкой (upd.rs): проверка подписи как у tauri-plugin-updater
minisign-verify = "0.2"
base64 = "0.22"
# замеры связи (probe.rs): TLS с нужным SNI на IP сервера - тот же rustls 0.23 (ring), что у reqwest
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# 27.09 (п.17): дельта-обновления Mac - патч zstd --patch-from по распакованному .app.tar, база хранится сжатой; gzip для установки
[target.'cfg(target_os = "macos")'.dependencies]
zstd = { version = "0.13", features = ["experimental"] }
flate2 = "1"
ring = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
