:root{--gold-text:linear-gradient(100deg,#7d5516 0%,#c9973a 16%,#f3d88d 26%,#fff6d6 30%,#f3d88d 34%,#c9973a 44%,#8a5f18 58%,#d8a948 76%,#7d5516 100%)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(70% 45% at 50% 42%,#1a140a 0%,#070604 55%,#000 100%);
  font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:#cfcfcf;text-align:center;opacity:0;animation:in .6s ease-out .05s forwards}
@keyframes in{to{opacity:1}}

/* щит в кольце: кольцо — бегущая золотая дуга */
.orb{position:relative;width:210px;height:210px;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,rgba(240,192,82,.30),rgba(240,192,82,0) 64%);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35;transform:scale(.88)}}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 1.6s linear infinite}
.ring2{animation:spin 3.4s linear infinite reverse;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.shield{position:relative;width:104px;height:124px;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(240,190,80,.35));animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}

.mark{margin-top:30px;font-family:'Cinzel',serif;font-weight:700;font-size:16px;letter-spacing:.36em;padding-left:.36em;
  background:var(--gold-text);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 3.2s linear infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}

.st{margin-top:22px;font-family:'Forum',Georgia,serif;font-size:22px;color:#f3ead2;letter-spacing:.02em;min-height:1.3em}
.dots i{display:inline-block;width:5px;height:5px;margin-left:5px;border-radius:50%;background:#e3bd62;vertical-align:middle;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.sub{margin-top:10px;max-width:300px;font-size:13px;line-height:1.55;color:#8d8d8d;min-height:3.1em;transition:opacity .4s}

/* тонкая полоса внизу — «идёт работа» */
.bar{position:fixed;left:50%;bottom:44px;width:180px;height:2px;margin-left:-90px;border-radius:2px;background:rgba(214,172,82,.14);overflow:hidden}
.bar::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:2px;
  background:linear-gradient(90deg,transparent,#f3d58a,transparent);animation:run 1.4s ease-in-out infinite}
@keyframes run{to{left:100%}}
body.off .bar::after{animation-duration:2.6s;opacity:.5}
body.leave{animation:out .35s ease-in forwards}
@keyframes out{to{opacity:0}}
.rep{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;border:1px solid rgba(227,189,98,.55);
  background:rgba(20,15,6,.85);color:#f3d58a;font:600 13px system-ui,-apple-system,sans-serif;cursor:pointer;white-space:nowrap}
.rep.ok{border-color:#3fbf6a;color:#7ee29a;cursor:default}
.rep-note{position:fixed;left:24px;right:24px;bottom:128px;margin:0;text-align:center;color:rgba(243,213,138,.7);font:12px system-ui,-apple-system,sans-serif}
@media (prefers-reduced-motion:reduce){.ring,.ring2,.shield,.orb::before,.mark,.bar::after{animation:none}}
</style>

<script>
(function () {
  // Заставка компьютерной версии: окно открывается сразу (даже без интернета после перезагрузки),
  // ждём, пока сервер станет доступен, и только тогда уходим на страницу приложения.
  var APP = 'https://vpn.insellers.su/?app=desktop&v=' + encodeURIComponent(window.__INS_V || '');
  var PROBE = 'https://vpn.insellers.su/app/desktop/latest.json';
  var st = document.getElementById('st'), sub = document.getElementById('sub');
  var t0 = Date.now(), fails = 0, done = false, busy = false;
  // 30.09 (владелец: чёрное окно после 502 во время выкладки): режим «Переподключаемся…» - сюда приложение уводит окно, когда
  // страница не загрузилась или не отвечает. Повтор каждые 5 с. Сервер проверяет само приложение (server_ok: ответ 200 и «ok»);
  // прежняя проверка (запрос без чтения ответа) принимала 502 за «сервер жив».
  var RECON = /[?&]reconnect=/.test(location.search);
  var TI = window.__TAURI_INTERNALS__;
  function check() {
    if (TI && TI.invoke) {
      var down = new Error('down');
      return TI.invoke('server_ok').then(function (ok) { if (!ok) throw down; }, function () { return plain(); })

    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 5000);

      .then(function () { clearTimeout(to); }, function (e) { clearTimeout(to); throw e; });
  }

  function say(a, b) { if (st.textContent !== a) st.textContent = a; if (sub.textContent !== b) sub.textContent = b; }

  function go() {
    if (done) return; done = true;
    say('Загружаем', '');
    var wait = Math.max(0, 700 - (Date.now() - t0));        // заставка не мелькает на быстром интернете
    setTimeout(function () { document.body.classList.add('leave'); setTimeout(function () { location.replace(APP); }, 300); }, wait);

    check()
      .then(function () { busy = false; go(); })
      .catch(function () { busy = false; fails++; status(); setTimeout(probe, RECON ? 5000 : (fails < 5 ? 1500 : 3000)); });

    document.body.classList.toggle('off', off);

    if (sent || !TI || !TI.invoke) return;
    rep.disabled = true; rep.textContent = 'Отправляем…';
    TI.invoke('splash_report', { why: st.textContent + (sub.textContent ? ' - ' + sub.textContent : ''), secs: Math.round((Date.now() - t0) / 1000) })
      .then(function (ok) {
        if (ok) { sent = true; rep.classList.add('ok'); rep.textContent = 'Отчёт отправлен ✓'; repn.textContent = ''; }
        else { rep.disabled = false; rep.textContent = 'Не отправилось - ещё раз'; }
      }, function () { rep.disabled = false; rep.textContent = 'Не отправилось - ещё раз'; });
  });

  window.addEventListener('online', function () { fails = 0; status(); probe(); });
  window.addEventListener('offline', status);
  status();
  if (RECON) setTimeout(probe, 5000); else probe();       // экран переподключения: первая попытка через 5 с
})();
</script>
</body>
</html>
